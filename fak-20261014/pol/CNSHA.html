const MODE = 'pol';
const POL  = 'CNSHA';
const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => (v==null||v==='') ? '' : Number(v).toLocaleString('en-US',{maximumFractionDigits:0});
const rate = (f,t) => t ? (f/t*100).toFixed(1) : '0.0';
const cls  = r => r>=70 ? 'ok' : (r>=50 ? 'mid' : 'bad');
const ccls = r => r>=70 ? 'ok' : (r>=50 ? 'warn' : 'warn');
// 段价三态：数值=40'加权成交价；'NO40'=该段无40'箱量；null=有箱量但缺价
const px = v => v==='NO40' ? ` · <span class="npx">无40'货量</span>`
              : (v==null ? ` · <span class="npx">无40'价</span>` : ` · $${num(v)}`);
const pxTip = v => v==='NO40' ? `无40'货量` : (v==null ? `无40'价` : `$${num(v)}`);

function bar(t,f,u,label,cn){
  const non = Math.max(0, t-f-u);
  const p = v => t ? (v/t*100).toFixed(2)+'%' : '0%';
  return `<div class="bar">
    <div class="nm">${esc(label)}<span class="cn">${esc(cn||'')}</span></div>
    <div class="tr"><i class="i-fak" style="width:${p(f)}"></i><i class="i-non" style="width:${p(non)}"></i><i class="i-unr" style="width:${p(u)}"></i></div>
    <div class="vv">${num(t)} T · ${rate(f,t)}%</div></div>`;
}

function kpis(items){
  return `<div class="kpis">${items.map(k=>
    `<div class="kpi"><div class="l">${esc(k.l)}</div><div class="v ${k.c||''}">${esc(k.v)}</div></div>`
  ).join('')}</div>`;
}

// ---- FAK 热力图 ----
// 档位与页面 ok/mid/bad 语义对齐（70 / 50 为界），无量 -> null 渲染灰虚线格
const hq = r => r>=90 ? 'q4' : (r>=70 ? 'q3' : (r>=50 ? 'q2' : (r>=25 ? 'q1' : 'q0')));

function heatmap(title, cols, cells, rows){
  if(!DATA.heat) return '';
  let h = `<h2>${esc(title)}</h2><div class="hmbox">`;
  h += `<div class="hmscroll"><table class="hm"><thead><tr><th></th>`;
  cols.forEach(c=>{
    h += `<th class="ch"><span class="cc">${esc(c.c)}</span>`
       + (c.n ? `<span class="cn2">${esc(c.n)}</span>` : '')
       + (c.rt ? `<span class="cn2">${esc(c.rt)}</span>` : '')
       + `<span class="ct">${num(c.t)} T${c.r!=null?' · '+c.r+'%':''}</span></th>`;
  });
  h += `</tr></thead><tbody>`;
    rows.forEach((p,i)=>{
    // 行首只放 5 字口岸代码（货量在列头与格内已有，行首再写一遍是噪音）
    h += `<tr><th class="rh"><a href="#/pol/${esc(p.c)}" class="polrow">${esc(p.c)}</a></th>`;
    const line = cells[i] || [];
    cols.forEach((c,j)=>{
      const d = line[j];
      if(d==null){ h += `<td><div class="hc na" title="${esc(p.c)} × ${esc(c.c)}：本期无货">-</div></td>`; return; }
      const tip = `${esc(p.c)} × ${esc(c.c)}
总 ${num(d.t)} T · FAK ${num(d.f)} T · 履行 ${d.r}%`
        + `
FAK段价 ${d.f>0?pxTip(d.fp):'-'} · NF段价 ${d.nf>0?pxTip(d.np):'-'}`
        + (d.bp!=null ? `
FAK基准价(40') ${pxTip(d.bp)}` : '')
        + `
未录入 ${num(d.u)} T（${d.ur}%）`;
      // 整格 100% 未录入：当作「数据不存在」，与本期无货格同款（浅灰虚线「-」，不给明细）
      if(d.u>0 && d.ur>=99.95){
        h += `<td><div class="hc na" title="${esc(p.c)} × ${esc(c.c)}：FAK 价未录入（按无数据显示）">-</div></td>`;
        return;
      }
      let body = '';
      if(d.f>0) body += `<span class="ln">FAK ${d.r.toFixed(1)}% · ${num(d.f)}T${px(d.fp)}</span>`;
      else if(d.bp!=null) body += `<span class="ln ref">FAK基准 $${num(d.bp)}</span>`;
      if(d.nf>0) body += `<span class="ln">NF ${d.nr.toFixed(1)}% · ${num(d.nf)}T${px(d.np)}</span>`;
      if(d.u>0) body += `<span class="ln dim">未录入 ${d.ur.toFixed(1)}% · ${num(d.u)}T</span>`;
      h += `<td><div class="hc ${hq(d.r)}" title="${tip}">`
         + (d.ur>=30 ? `<span class="gap"></span>` : '')
         + body + `</div></td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

  return `<div class="lg">

    <span class="steps">
      <i style="background:#cf3b3b"></i><i style="background:#d9801a"></i>

    <span>低 0% → 25% → 50% → 70% → 90% 高</span>

    <span style="margin-left:8px">无 FAK 货量的格子首行显示该组合的 <b>FAK 基准价</b>（FAK Unit，40'），便于与实际成交价对照</span>

}

  h += kpis([
    {l:'总货量', v:num(m.t)+' T'},

    {l:'FAK 履行率', v:m.r+'%', c:cls(m.r)},
    {l:'基准未录入', v:num(m.u)+' T', c:m.u>0?'warn':'mute'},
    {l:'船 / 口岸 / 客户', v:m.v+' / '+m.p+' / '+m.cust},
  ]);

  h += `<h2>目的港履行结构（${esc(DATA.meta.scope)}）</h2><div class="bars">`;
  DATA.dels.forEach(d => h += bar(d.t,d.f,d.u,d.c,d.n));
  h += `</div><div class="hint" style="margin-top:8px">绿=FAK履行 · 橙=Non-FAK · 灰=基准未录入</div>`;

  h += `<h2>口岸排行</h2>
  <table><thead><tr><th>口岸</th><th class="n">总TEU</th><th class="n">FAK</th><th class="n">履行率</th><th class="n">未录入</th><th class="n">船</th><th class="n">客户</th></tr></thead><tbody>`;
  DATA.pols.forEach(p=>{
    h += `<tr class="polrow" data-pol="${esc(p.c)}">
      <td class="pc">${esc(p.c)}</td><td class="n">${num(p.t)}</td><td class="n">${num(p.f)}</td>
      <td class="n"><span style="color:${p.r>=70?'#12785a':(p.r>=50?'#b45309':'#d93030')}">${p.r}%</span></td>
      <td class="n">${num(p.u)}</td><td class="n">${p.v}</td><td class="n">${p.n}</td></tr>`;
  });
  h += `</tbody></table>`;

  h += `<h2>点击查看口岸明细</h2><div class="grid">`;
  DATA.pols.forEach(p=>{
    h += `<a class="card" href="#/pol/${esc(p.c)}" data-pol="${esc(p.c)}">
      <div class="top"><span class="pc">${esc(p.c)}</span><span class="rt ${cls(p.r)}">${p.r}%</span></div>
      <div class="met">${num(p.t)} T · FAK ${num(p.f)} · 未录入 ${num(p.u)}</div>
      <div class="mini">${bar(p.t,p.f,p.u,'','')}</div></a>`;
  });
  h += `</div>`;

  // ---- 底部：FAK 热力图，按目的港拆分，一个 POD 一张「口岸 × 船(VVD)」 ----
  if(DATA.heat && DATA.heat.pvDel && DATA.heat.pvDel.length){
    DATA.heat.pvDel.forEach(d=>{
      h += heatmap(
        `${d.n}（${d.c}）· 口岸 × 船(VVD)　${num(d.t)} T · 履行 ${d.r}% · 未录入 ${num(d.u)} T`,
        d.cols, d.cells, d.rows);
      h += legend() + `</div>`;
    });
    h += `<div class="hint" style="margin-top:6px">每个目的港一张矩阵，行/列只保留该港有货的口岸与船；`
      + `点击行首口岸代码可下钻到该口岸明细，鼠标悬停看该格 FAK / 未录入明细。`
      + ((DATA.meta.skipPol && DATA.meta.skipPol.length)
         ? `热力图不含小口岸 ${DATA.meta.skipPol.join(' / ')}，完整数据见口岸排行与各口岸页。`
         : '')
      + `</div>`;
  }
  return h;
}

function viewPol(pol){
  const p = DATA.pols.find(x=>x.c===pol);
  const d = DATA.byPol[pol];
  if(!p || !d) return `<div class="empty">无该口岸数据</div>`;
  let h = kpis([
    {l:'口岸货量', v:num(p.t)+' T'},
    {l:'FAK 履行', v:num(p.f)+' T', c:'ok'},
    {l:'FAK 履行率', v:p.r+'%', c:cls(p.r)},
    {l:'基准未录入', v:num(p.u)+' T', c:p.u>0?'warn':'mute'},
    {l:'船 / 客户', v:p.v+' / '+p.n},
  ]);

  // 该口岸的目的港结构
  const dm = {};
  d.vvds.forEach(v=>v.dels.forEach(x=>{
    const e = dm[x.c] = dm[x.c] || {n:x.n,t:0,f:0,u:0};
    e.t+=x.t; e.f+=x.f; e.u+=x.u;
  }));
  h += `<h2>目的港结构</h2><div class="bars">`;
  Object.entries(dm).sort((a,b)=>b[1].t-a[1].t).forEach(([c,e])=> h += bar(e.t,e.f,e.u,c,e.n));
  h += `</div>`;

  h += `<div class="tools"><input type="search" id="q" placeholder="搜索客户名称 / 客户代码 / 代理"><span class="hint" id="qh"></span></div>`;

  h += `<h2>VVD 交叉分析（VVD → 目的港 → 客户）</h2>`;
  d.vvds.forEach((v,i)=>{
    h += `<details${i===0?' open':''}>
      <summary><span class="mk">&#9654;</span><span class="vv">${esc(v.v)}</span>
        <span class="rt">${esc(v.rt)} · ETD ${esc(v.e)}</span><span class="sp"></span>
        <span class="mt">${num(v.t)} T · FAK ${num(v.f)} · <strong style="color:${v.r>=70?'#12785a':(v.r>=50?'#b45309':'#d93030')}">${v.r}%</strong> · 未录入 ${num(v.u)}</span></summary>
      <div class="dl">`;
    v.dels.forEach(dl=>{
      h += `<div class="dlh"><strong>${esc(dl.c)}</strong><span class="cn">${esc(dl.n)}</span>
        <span class="mt">${num(dl.t)} T · FAK ${num(dl.f)} (<strong style="color:${dl.r>=70?'#12785a':(dl.r>=50?'#b45309':'#d93030')}">${dl.r}%</strong>) · 未录入 ${num(dl.u)}</span></div>
        <table><thead><tr><th>客户名称</th><th>客户代码</th><th>类型</th><th>对接代理</th>
        <th class="n">TEU</th><th class="n">FAK TEU</th><th class="n">占比</th>
        <th class="n">成交价20</th><th class="n">FAK20</th><th class="n">成交价40</th><th class="n">FAK40</th></tr></thead><tbody>`;
      dl.custs.forEach(c=>{
        const tk = c.ty==='FAK'?'t-fak':(c.ty==='Non-FAK'?'t-non':'t-unr');
        const key = (c.n+' '+c.c+' '+c.a).toLowerCase();
        const gap = (c.p40!=='' && c.f40!=='' && Number(c.p40)<Number(c.f40));
        h += `<tr data-k="${esc(key)}"><td>${esc(c.n)}</td><td>${esc(c.c)}</td>
          <td><span class="tag ${tk}">${esc(c.ty)}</span></td><td>${esc(c.a)}</td>
          <td class="n">${num(c.t)}</td><td class="n">${num(c.f)}</td><td class="n">${c.r}%</td>
          <td class="n">${num(c.p20)}</td><td class="n">${num(c.f20)}</td>
          <td class="n ${gap?'neg':''}">${num(c.p40)}</td><td class="n">${num(c.f40)}</td></tr>`;
      });
      h += `</tbody></table>`;
    });
    h += `</div></details>`;
  });
  return h;
}

function render(){
  const app = $('#app');
  const parts = location.hash.replace(/^#\/?/,'').split('/');
  let pol = null;
  if(MODE==='pol') pol = POL;
  else if(parts[0]==='pol' && parts[1]) pol = parts[1];

  $('#hdrSub').textContent =
    `口径：${DATA.meta.scope}｜${DATA.meta.p} 个中国口岸 · ${DATA.meta.v} 条船 · ${DATA.meta.bl} 票 · ${num(DATA.meta.t)} TEU`;

  if(pol){
    const p = DATA.pols.find(x=>x.c===pol);
    $('#app').innerHTML =
      `<div class="crumb">${MODE==='pol'?'<a href="../index.html">总览</a>':'<a href="#/">总览</a>'}<span>/</span>${esc(pol)}</div>`
      + viewPol(pol);
    document.title = `${pol} · 国庆红海货量及运价 FAK完船报告`;
    $('#ftr').innerHTML = `${esc(pol)}｜共 ${p?p.v:0} 条船 · ${p?p.n:0} 家客户 · 数据来源 Local_Analytical_By_Vessel.xlsx（Shipper 口径）`;
  }else{
    $('#app').innerHTML = viewOverview();
    document.title = '国庆红海货量及运价 FAK完船报告';
    $('#ftr').innerHTML = `数据来源 Local_Analytical_By_Vessel.xlsx（Shipper 口径）｜口径：${esc(DATA.meta.scope)}`;
  }
  bind();
}

function bind(){
  document.querySelectorAll('.polrow').forEach(tr=>{
    tr.onclick = ()=>{ location.hash = '#/pol/' + tr.dataset.pol; };
  });
  const q = $('#q');
  if(q){
    q.oninput = ()=>{
      const v = q.value.trim().toLowerCase();
      let shown = 0, total = 0;
      document.querySelectorAll('#app tbody tr[data-k]').forEach(tr=>{
        total++;
        const ok = !v || tr.dataset.k.indexOf(v) >= 0;
        tr.style.display = ok ? '' : 'none';
        if(ok) shown++;
      });
      document.querySelectorAll('#app details').forEach(d=>{ d.open = !!v; });
      $('#qh').textContent = v ? `匹配 ${shown} / ${total} 行` : '';
    };
  }
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
